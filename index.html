<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #18181b;
    --muted: #71717a;
    --card: #ffffff;
    --accent: #f9622c;
    --accent-ink: #ffffff;
    --accent2: #059669;
    --used: #f4f4f5;
    --border: #e7e5e4;
    --shadow: 0 1px 2px rgba(24,24,27,.04), 0 8px 24px rgba(24,24,27,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --card: #18181b;
      --accent: #fb7a3f;
      --accent-ink: #18181b;
      --accent2: #34d399;
      --used: #26262a;
      --border: #2a2a2e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 460px; }
  h1 {
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: -0.01em;
    text-align: center;
    margin: 0 0 6px;
  }
  .sub {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .chain-area {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 18px;
    min-height: 64px;
  }
  .chain-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .chain-words {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .chain-words .word {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 700;
  }
  .arrow { color: var(--muted); }
  .score-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 500;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .score-row b { color: var(--fg); font-size: 1.05rem; font-weight: 900; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 4px;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .tile:hover { border-color: var(--accent); }
  .tile:active { transform: scale(0.94); }
  .tile.used {
    background: var(--used);
    border-color: var(--used);
    color: var(--muted);
    cursor: not-allowed;
  }
  .tile.used:hover { border-color: var(--used); }
  .tile.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .tile.disabled:hover { border-color: var(--border); }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  button {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 0.9rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.08s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  #undoBtn { background: var(--used); color: var(--fg); }
  #giveupBtn { background: var(--accent); color: var(--accent-ink); }
  .result {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
    display: none;
  }
  .result.show { display: block; }
  .result h2 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 900; }
  .result .big { font-size: 2.4rem; color: var(--accent2); font-weight: 900; letter-spacing: -0.02em; }
  #shareXBtn {
    background: #000;
    color: #fff;
    margin-top: 14px;
    width: 100%;
  }
  #shareBtn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    width: 100%;
    font-size: 0.8rem;
    margin-top: 8px;
  }
  .answer {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--muted);
    text-align: left;
    line-height: 1.7;
  }
  .rule {
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
    margin: 4px 0 22px;
  }
  .credit {
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    margin-top: 30px;
  }
</style>

<body>
<div class="wrap">
  <h1>🔤 日刊しりとり最長チャレンジ</h1>
  <div class="sub" id="dateLabel">-</div>
  <div class="rule">16語の中から、しりとりで一番長くつなげよう</div>

  <div class="chain-area">
    <div class="chain-label">今のチェーン</div>
    <div class="chain-words" id="chainWords"><span style="opacity:.4">単語をタップして開始</span></div>
    <div class="score-row">
      <span>現在 <b id="curLen">0</b>語</span>
      <span>自己ベスト <b id="bestSoFar">0</b>語</span>
    </div>
    <div class="score-row" style="margin-top:4px;padding-top:0;border-top:none;">
      <span>本日の残り挑戦 <b id="attemptsLeft">3</b>回</span>
    </div>
  </div>

  <div class="grid" id="tileGrid"></div>

  <div class="controls">
    <button id="undoBtn">1つ戻す</button>
    <button id="giveupBtn">ここで終了して結果を見る</button>
  </div>

  <div class="result" id="resultBox">
    <h2>結果</h2>
    <div>あなたの記録</div>
    <div class="big" id="finalScore">0語</div>
    <div id="compareLine"></div>
    <button id="shareXBtn">🕊️ Xでシェア</button>
    <button id="shareBtn" style="margin-top:8px;">結果をコピー(他のSNS用)</button>
    <div class="answer" id="answerBox"></div>
  </div>

  <div class="credit">単語データ: Mozc dictionary (IPAdic準拠) を使用</div>
</div>

<script>
// ==== その日の問題を puzzles.json から日付ベースで選ぶ ====
let PUZZLE = null;
let PUZZLE_NO = 0;   // Wordleの「#645」のような通し番号(在庫が尽きても増え続ける)

function pickPuzzleKeyForToday(keys) {
  // 日付(日本時間の通し日数)を問題数で割った余りで、毎日決まった1問を選ぶ。
  // day-N という命名を前提に、Nの若い順にソートして周期的に割り当てる。
  const sorted = keys.slice().sort((a, b) => {
    const na = parseInt(a.split("-")[1], 10);
    const nb = parseInt(b.split("-")[1], 10);
    return na - nb;
  });
  const JST_OFFSET_MS = 9 * 60 * 60 * 1000;
  const epoch = Date.UTC(2026, 0, 1); // 固定の起点日(UTC基準の目印。JST補正は現在時刻側にかける)
  const daysSince = Math.floor((Date.now() + JST_OFFSET_MS - epoch) / 86400000);
  PUZZLE_NO = daysSince + 1;
  const idx = ((daysSince % sorted.length) + sorted.length) % sorted.length;
  return sorted[idx];
}

async function loadPuzzle() {
  const res = await fetch("puzzles.json");
  const all = await res.json();
  const key = pickPuzzleKeyForToday(Object.keys(all));
  PUZZLE = all[key];
}

const kanaSmallMap = {"ぁ":"あ","ぃ":"い","ぅ":"う","ぇ":"え","ぉ":"お","っ":"つ","ゃ":"や","ゅ":"ゆ","ょ":"よ","ゎ":"わ"};
const vowelGroups = {
  "あかさたなはまやらわがざだばぱ":"あ",
  "いきしちにひみりぎじぢびぴ":"い",
  "うくすつぬふむゆるぐずづぶぷ":"う",
  "えけせてねへめれげぜでべぺ":"え",
  "おこそとのほもよろごぞどぼぽ":"お",
};
function vowelOf(ch){
  for (const g in vowelGroups) if (g.includes(ch)) return vowelGroups[g];
  return null;
}
function normalizeSmall(s){
  return s.split("").map(c => kanaSmallMap[c] || c).join("");
}
function headKana(reading){
  return normalizeSmall(reading)[0];
}
function tailKana(reading){
  let s = normalizeSmall(reading);
  let i = s.length - 1;
  while (i >= 0 && s[i] === "ー") i--;
  if (i < 0) return null;
  const ch = s[i];
  if (s.length - 1 > i) return vowelOf(ch) || ch;
  return ch;
}

const MAX_ATTEMPTS = 3;

let chain = [];      // インデックスの配列(今の挑戦分)
let bestSoFar = 0;   // 今の挑戦での最高到達
let finished = false;      // 今の挑戦を終えたか
let locked = false;        // 3回使い切って、これ以上操作させない状態
let attemptsUsed = 0;      // 今日すでに使った挑戦回数
let dayBest = 0;           // 今日の全挑戦を通じての最高記録
let dayBestChain = [];     // その最高記録の内訳

function storageKey() {
  return `shiritori_progress_${PUZZLE_NO}`;
}
function saveProgress() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify({
      attempts: attemptsUsed, best: dayBest, bestChain: dayBestChain,
    }));
  } catch (e) { /* localStorageが使えない環境は無視して継続プレイ扱いにする */ }
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(storageKey());
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function render(){
  const grid = document.getElementById("tileGrid");
  grid.innerHTML = "";
  PUZZLE.words.forEach((w, idx) => {
    const div = document.createElement("div");
    const usedIdx = chain.indexOf(idx);
    const isUsed = usedIdx !== -1;
    let canPick = !isUsed && !finished && !locked;
    if (canPick && chain.length > 0) {
      const lastTail = tailKana(PUZZLE.words[chain[chain.length-1]].reading);
      canPick = headKana(w.reading) === lastTail;
    }
    div.className = "tile" + (isUsed ? " used" : "") + (!canPick && !isUsed ? " disabled" : "");
    div.textContent = w.surface;
    div.onclick = () => { if (canPick) { chain.push(idx); render(); } };
    grid.appendChild(div);
  });

  const chainWordsEl = document.getElementById("chainWords");
  if (chain.length === 0) {
    chainWordsEl.innerHTML = '<span style="opacity:.4">単語をタップして開始</span>';
  } else {
    chainWordsEl.innerHTML = chain.map((idx,i) => {
      const w = PUZZLE.words[idx];
      return (i>0 ? '<span class="arrow">→</span>' : '') + `<span class="word">${w.surface}</span>`;
    }).join("");
  }
  document.getElementById("curLen").textContent = chain.length;
  if (chain.length > bestSoFar) {
    bestSoFar = chain.length;
    document.getElementById("bestSoFar").textContent = bestSoFar;
  }
  document.getElementById("attemptsLeft").textContent = Math.max(0, MAX_ATTEMPTS - attemptsUsed);
}

document.getElementById("undoBtn").onclick = () => {
  if (finished || locked) return;
  chain.pop();
  render();
};

function finishAttempt(){
  attemptsUsed += 1;
  if (bestSoFar > dayBest) {
    dayBest = bestSoFar;
    dayBestChain = chain.slice();
  }
  saveProgress();
  if (attemptsUsed >= MAX_ATTEMPTS) locked = true;
  showResult();
}

document.getElementById("giveupBtn").onclick = () => {
  if (locked) return;
  if (finished) {
    // 「もう一度挑戦する」ボタンとして機能してる状態。次の挑戦を始める。
    chain = [];
    bestSoFar = 0;
    finished = false;
    document.getElementById("resultBox").classList.remove("show");
    document.getElementById("giveupBtn").textContent = "ここで終了して結果を見る";
    render();
    return;
  }
  finished = true;
  finishAttempt();
};

function showResult(){
  const box = document.getElementById("resultBox");
  box.classList.add("show");
  document.getElementById("finalScore").textContent = dayBest + "語";

  const best = PUZZLE.best;
  const attemptsLeft = MAX_ATTEMPTS - attemptsUsed;
  let cmp;
  if (dayBest >= best) cmp = `最長解(${best}語)に到達しました🎉`;
  else if (attemptsLeft > 0) cmp = `最長解は ${best}語 でした(残り${attemptsLeft}回挑戦できます)`;
  else cmp = `最長解は ${best}語 でした`;
  document.getElementById("compareLine").textContent = cmp;

  const answerChain = PUZZLE.best_path.map(i => PUZZLE.words[i].surface).join(" → ");
  document.getElementById("answerBox").innerHTML = "最長解の一例: " + answerChain;

  const giveupBtn = document.getElementById("giveupBtn");
  if (locked) {
    giveupBtn.textContent = "本日の挑戦は終了しました(3回とも使用済み)";
    giveupBtn.disabled = true;
    document.getElementById("undoBtn").disabled = true;
  } else if (finished) {
    giveupBtn.textContent = `もう一度挑戦する(残り${attemptsLeft}回)`;
    giveupBtn.disabled = false;
  }

  render();
}

function buildResultBar(score, best) {
  // Wordleの緑四角のノリで、自己ベストを埋めた分だけ色を付ける。
  // best より score が多く伸びる(=満点超え)ことはないが、念のためクランプする。
  const total = Math.max(best, score, 1);
  const filled = Math.min(score, total);
  return "🟧".repeat(filled) + "⬜".repeat(total - filled);
}

function buildShareText(){
  // 無名の新作なので、Wordleのように絵文字バーだけで通用しない。
  // 初見の人でも「何のゲームか」が1行で分かるようにする。
  const bar = buildResultBar(dayBest, PUZZLE.best);
  const perfect = dayBest >= PUZZLE.best;
  const siteUrl = location.href.split("?")[0].split("#")[0];
  return `毎日16語からしりとりの最長チェーンを作るゲーム「日刊しりとり」#${PUZZLE_NO}
${bar} ${dayBest}/${PUZZLE.best}語${perfect ? " 🎉" : ""}

自分もやってみる↓
${siteUrl}
#日刊しりとり`;
}

document.getElementById("shareXBtn").onclick = () => {
  // X Web Intent: OAuth不要で投稿画面を開ける公式の仕組み。
  const text = buildShareText();
  const intentUrl = "https://x.com/intent/tweet?text=" + encodeURIComponent(text);
  window.open(intentUrl, "_blank", "noopener,noreferrer,width=600,height=500");
};

document.getElementById("shareBtn").onclick = () => {
  const text = buildShareText();
  navigator.clipboard?.writeText(text);
  alert("結果をコピーしました。SNSに貼り付けてシェアできます。\n\n" + text);
};

const todayLabel = new Date().toLocaleDateString("ja-JP", { year:"numeric", month:"long", day:"numeric" });

loadPuzzle().then(() => {
  document.getElementById("dateLabel").textContent = `#${PUZZLE_NO} ・ ${todayLabel}`;

  const progress = loadProgress();
  if (progress) {
    attemptsUsed = progress.attempts || 0;
    dayBest = progress.best || 0;
    dayBestChain = progress.bestChain || [];
  }

  if (attemptsUsed >= MAX_ATTEMPTS) {
    // 3回使い切っている。リロードでの無限リトライを防ぐため、直近の最高記録を出して終了。
    chain = dayBestChain.slice();
    bestSoFar = dayBest;
    finished = true;
    locked = true;
    showResult();
  } else {
    render();
  }
}).catch(err => {
  document.getElementById("tileGrid").innerHTML =
    '<div style="grid-column:1/-1;color:#c0392b;font-size:.85rem;">'
    + '問題データ(puzzles.json)の読み込みに失敗しました。'
    + 'file:// を直接開いた場合はブラウザがfetchをブロックすることがあるので、'
    + 'ローカルサーバー(例: python -m http.server)経由で開いてください。<br>詳細: '
    + err + '</div>';
  console.error(err);
});
</script>
</body>
</html>
